// modal
<button class="button-new-category" id="modal-trigger">add new</button>
<div id="modal" class="modal">
    <div class="modal-content">
        <h3 class="title">Konfirmasi Hapus</h3>
        <form id="modal-input-form">
            <input type="hidden" name="id" id="hidden-id" value="">
            <p>Apakah Anda yakin ingin menghapus item ini?</p>

            <div class="modal-actions">
                <button id="modal-form-cancel" class="button-outline">Batal</button>
                <button id="modal-form-do" class="button-primary">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
